<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1eee6">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ボドゲ情報ボード</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">🎲 <b>ボドゲ情報ボード</b></div>
  <button id="editBtn" class="pill">並べ替え</button>
</header>
<main>
  <div class="pagehead">
    <h1>ホーム</h1>
    <p id="meta" class="muted">読み込み中…</p>
  </div>
  <div id="addBar" class="addbar" hidden>
    <span class="muted">ボックスを追加：</span>
    <button data-add="watch">気になるゲーム</button>
    <button data-add="calendar">発売カレンダー</button>
    <button data-add="shop">ショップ入荷</button>
    <button data-add="maker">メーカー記事</button>
    <button data-add="news">ニュース</button>
    <button data-add="owned">所持ゲーム</button>
    <button data-add="events">イベント</button>
    <button data-add="xlinks">Xアカウント</button>
    <button data-add="reset" class="ghost">初期配置に戻す</button>
  </div>
  <div id="board" class="board"><div class="col" data-col="0"></div><div class="col" data-col="1"></div></div>
</main>
<script src="app.js"></script>
</body>
</html>

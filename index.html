<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f1eee6">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ボドゲ情報ボード</title>
<script>
// 新しい版が公開されていたら読み直す（ホーム画面アプリの古いページ対策）。版を上げたら version.json と下の V を同じ値に
(() => {
  const V = "20261126m";
  const check = () => fetch("version.json?" + Date.now(), { cache: "no-store" }).then((r) => r.json()).then((d) => {
    if (d.v && d.v !== V && sessionStorage.getItem("bgb.reload") !== d.v) {
      sessionStorage.setItem("bgb.reload", d.v);
      location.replace(location.pathname + "?v=" + d.v + location.hash);
    }
  }).catch(() => {});
  check();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") check(); });
})();
</script>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="stylesheet" href="style.css?v=20261126m">
</head>
<body>
<header class="top">
  <div class="brand">🎲 <b>ボドゲ情報ボード</b></div>
  <button id="editBtn" class="pill">並べ替え</button>
</header>
<nav class="tabs"><a href="#" data-pg="home">ホーム</a><a href="#owned" data-pg="owned">所持ゲーム</a></nav>
<main>
  <div class="pagehead">
    <h1>ホーム</h1>
    <p id="meta" class="muted">読み込み中…</p>
  </div>
  <div id="addBar" class="addbar" hidden>
    <span class="muted">ボックスを追加：</span>
    <button data-add="watch">気になるゲーム</button>
    <button data-add="calendar">発売カレンダー</button>
    <button data-add="shop">ショップ入荷</button>
    <button data-add="maker">メーカー記事</button>
    <button data-add="news">ニュース</button>
    <button data-add="owned">所持ゲーム</button>
    <button data-add="events">イベント</button>
    <button data-add="funding">クラファン</button>
    <button data-add="crowd">注目クラファン</button>
    <button data-add="xlinks">Xアカウント</button>
    <button data-add="reset" class="ghost">初期配置に戻す</button>
  </div>
  <div id="board" class="board"><div class="col" data-col="0"></div><div class="col" data-col="1"></div></div>
  <div id="ownedPage" class="opage"></div>
  <p class="credit"><a href="https://boardgamegeek.com" target="_blank" rel="noopener">Powered by BGG</a></p>
</main>
<script src="app.js?v=20261126m"></script>
<script src="owned.js?v=20261126m"></script>
</body>
</html>

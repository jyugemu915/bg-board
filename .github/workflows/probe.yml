name: probe
on: { push: { paths: [".github/workflows/probe.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/probe-bgg.mjs
        env:
          BGG_TOKEN: ${{ secrets.BGG_TOKEN }}
          QS: '["Quoridor", "Hit! Extreme", "Krampus'' Holiday Havoc", "Propolis", "Payback", "Brew", "Jingle Bell Roll", "16 Tabby Cats", "Paper Tales", "Factory Funner", "Sail", "Log", "New Lexio", "Beacon Patrol", "Ships & Shores", "Slambo", "Targi", "Rosenk\u00f6nig", "Agricola: All Creatures Big and Small", "Patchwork Winter Edition", "Splendor Duel", "Square One", "Project L", "Stack-O-Cats", "ICECOOL", "ICECOOL2", "Boxtop Pinball", "National Economy", "Parks & Potions", "River Valley Glassworks", "Finca", "Fit to Print", "Take it Easy", "Happy Fox", "Hiragana Mahjong", "Monopoly"]'

name: probe
on: { push: { paths: [".github/workflows/probe.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/probe-bgg.mjs
        env:
          BGG_TOKEN: ${{ secrets.BGG_TOKEN }}
          QS: '["カール大帝", "Carolus Magnus", "Shadow Blocks", "シャドウ・ブロック", "The Dawn of Pangaea", "Onda", "Migo", "Crazy Sherlock", "Yellow Brick Road", "Fruit Cocktail", "Space Lab", "Greenwood", "Gaudi", "P.I.", "Dice Stack", "Memoarrr", "メモリーチ", "Mole King", "モールキング", "Pentolini", "ペントリーニ", "Ada''s Library", "Chess Race", "IceCool Wizards", "Ice Cool", "Santa''s Workshop", "Tap 4", "Dicecream", "Dice Cream", "Formidable Farm", "Flip Town", "ローリー", "Rolly", "17 Dice Bets", "Blood Hunt", "The Clueless Club", "The Good, the Bad and the Goat", "Shimoda Perry Road", "Restore", "Just Chillin", "Right Now", "Nippon: Zaibatsu", "Forage", "スペースラボ", "ガウディ", "グリーンウッド"]'

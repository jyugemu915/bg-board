name: probe
on: { push: { paths: [".github/workflows/probe.yml"] } }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/probe-bgg.mjs
        env:
          BGG_TOKEN: ${{ secrets.BGG_TOKEN }}
          QS: '["Calimala", "Carcassonne", "Cartographers", "Clash of Decks", "War Chest", "Trick Takers", "King of Tokyo", "Mr. Diamond", "Mister Diamond"]'

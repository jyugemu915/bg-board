name: 情報を更新
on:
  schedule:
    - cron: "17 21,3,9 * * *"   # 日本時間 6:17 / 12:17 / 18:17
  workflow_dispatch: {}
  push:
    paths: ["config/**", "scripts/**"]
permissions:
  contents: write
concurrency:
  group: update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch.mjs
      - run: node scripts/events.mjs
      - run: node scripts/crowd.mjs
      - run: node scripts/bgg.mjs
        env:
          BGG_TOKEN: ${{ secrets.BGG_TOKEN }}
      - run: node scripts/owned-info.mjs
        env:
          BGG_TOKEN: ${{ secrets.BGG_TOKEN }}
      - name: 箱絵の高画質版を作る
        continue-on-error: true
        run: |
          npm install --no-save --no-package-lock --silent sharp
          node scripts/img.mjs
      - name: 変更があれば保存
        run: |
          git config user.name "bg-board-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "情報を更新"
          # 実行中に別のpushがあっても保存できるよう、最新を取り込んで再試行（data/ はbotだけが書くので衝突しない）
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep 5
          done
          exit 1

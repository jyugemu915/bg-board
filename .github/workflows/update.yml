name: 情報を更新
on:
  schedule:
    - cron: "17 21,3,9 * * *"   # 日本時間 6:17 / 12:17 / 18:17
  workflow_dispatch: {}
  push:
    paths: ["config/**", "scripts/**"]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/fetch.mjs
      - run: node scripts/events.mjs
      - name: 変更があれば保存
        run: |
          git config user.name "bg-board-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "情報を更新" && git push)
